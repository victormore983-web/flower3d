            animation: ol-card-in 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .ol-overlay[data-closing="true"] .ol-card {
            animation: ol-card-out 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        .ol-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding: 6px 14px 6px 8px;
            border-radius: 999px;
            font-family: var(--ol-font-mono);
            font-size: 11px;
            letter-spacing: 0.16em;
            color: var(--ol-champagne);
            background: linear-gradient(180deg, rgba(42, 24, 34, 0.55), rgba(20, 10, 16, 0.62));
            border: 1px solid rgba(255, 248, 234, 0.2);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .ol-back:active { transform: scale(0.95); }

        .ol-card-paper {
            padding: 22px;
            border-radius: 20px;
            background: var(--paper);
            box-shadow: 0 18px 50px rgba(20, 10, 16, 0.5), 0 0 0 1px rgba(255, 248, 234, 0.6);
        }

        .ol-card-eyebrow {
            margin: 0 0 14px;
            font-family: var(--ol-font-mono);
            font-size: 13px;
            letter-spacing: 0.02em;
            font-style: italic;
            color: var(--ink-soft);
        }

        .ol-card-text {
            margin: 16px 0 0;
            font-family: var(--ol-font-display);
            font-size: clamp(17px, 4vw, 20px);
            line-height: 1.6;
            color: var(--ink);
        }

        /* ---- keyframes (port nguyên từ keyframes.ts) ---- */
        @keyframes ol-breathe {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }
        @keyframes ol-core-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes ol-lantern-float {
            0%, 100% { translate: 0 0; opacity: 0.48; }
            50% { translate: 0 -10px; opacity: 0.68; }
        }
        /* Nhịp đập nằm trên <img>, còn cú trôi nằm ở wrapper — tách ra thì hai
           transform không giẫm lên nhau. */
        @keyframes ol-heart-pulse {
            0%, 55%, 100% { transform: scale(1); }
            12% { transform: scale(1.13); }
            25% { transform: scale(1); }
            37% { transform: scale(1.07); }
        }
        @keyframes ol-heart-glow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }
        @keyframes ol-twinkle {
            0%, 100% { opacity: var(--star-min, 0.2); }
            50% { opacity: var(--star-max, 0.9); }
        }
        @keyframes ol-nebula-a {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(6%, -4%, 0) scale(1.15); }
        }
        @keyframes ol-nebula-b {
            0%, 100% { transform: translate3d(0, 0, 0) scale(1.1); }
            50% { transform: translate3d(-7%, 5%, 0) scale(0.95); }
        }
        @keyframes ol-star-pan-1 {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-3%, 2%, 0); }
        }
        @keyframes ol-star-pan-2 {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(4%, -2.5%, 0); }
        }
        @keyframes ol-shoot {
            0% { transform: translate3d(0, 0, 0) rotate(var(--shoot-rot, 20deg)); opacity: 0; }
            3% { opacity: 1; }
            14% { opacity: 1; }
            20%, 100% { transform: translate3d(var(--shoot-x, 420px), var(--shoot-y, 160px), 0) rotate(var(--shoot-rot, 20deg)); opacity: 0; }
        }
        @keyframes ol-petal-fall {
            from { transform: translate3d(0, -8vh, 0); }
            to { transform: translate3d(var(--petal-drift, 20vw), 108vh, 0); }
        }
        @keyframes ol-petal-sway {
            from { transform: translateX(-18px); }
            to { transform: translateX(18px); }
        }
        /* Nghiêng tối đa 60°: lật hẳn 90° thì cánh hoa thành một vệt mảnh. */
        @keyframes ol-petal-spin {
            0% { transform: rotateZ(0deg) rotateX(0deg) rotateY(0deg); }
            50% { transform: rotateZ(180deg) rotateX(60deg) rotateY(25deg); }
            100% { transform: rotateZ(360deg) rotateX(0deg) rotateY(0deg); }
        }
        /* Ba đường lượn: trái, phải, mép trên–dưới. Góc xoay nhẹ cho con bướm
           "nhìn" theo hướng bay. */
        @keyframes ol-bfly-path-a {
            0%   { transform: translate3d(6vw, 18vh, 0) rotate(68deg); }
            18%  { transform: translate3d(20vw, 10vh, 0) rotate(197deg); }
            36%  { transform: translate3d(14vw, 38vh, 0) rotate(210deg); }
            54%  { transform: translate3d(4vw, 62vh, 0) rotate(133deg); }
            72%  { transform: translate3d(18vw, 80vh, 0) rotate(-17deg); }
            88%  { transform: translate3d(10vw, 44vh, 0) rotate(-12deg); }
            100% { transform: translate3d(6vw, 18vh, 0) rotate(68deg); }
        }
        @keyframes ol-bfly-path-b {
            0%   { transform: translate3d(84vw, 70vh, 0) rotate(-32deg); }
            20%  { transform: translate3d(74vw, 48vh, 0) rotate(35deg); }
            40%  { transform: translate3d(86vw, 24vh, 0) rotate(-41deg); }
            60%  { transform: translate3d(76vw, 8vh, 0) rotate(-208deg); }
            80%  { transform: translate3d(88vw, 40vh, 0) rotate(-169deg); }
            100% { transform: translate3d(84vw, 70vh, 0) rotate(-32deg); }
        }
        @keyframes ol-bfly-path-c {
            0%   { transform: translate3d(30vw, 6vh, 0) rotate(87deg); }
            25%  { transform: translate3d(62vw, 4vh, 0) rotate(174deg); }

        var timeout = setTimeout(function () { controller.abort(); }, 8000);
        fetch(API_BASE + encodeURIComponent(cfgId), { signal: controller.signal })
          .then(function (response) { return response.json(); })
          .then(function (data) {
            if (data && data.success && data.data && data.data.settings) {
              normalizeSettings(data.data.settings);
            }
          })
          .catch(function (err) { console.error("Error al cargar la configuración de la API:", err); })
          .then(function () {
            clearTimeout(timeout);
            startApp();
          });
      })();
    </script>
